<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restoran Menüsü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f5;--ink:#1c2a2d;--mute:#5d6d70;--line:#c9d3d0;--accent:#0f6b6b;--chip:#e3ebe8;--warn:#b4530a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191b;--ink:#e9efed;--mute:#9fb0ad;--line:#2f4042;--accent:#5fc4bd;--chip:#1b2b2d;--warn:#f0a35e}}
:root[data-theme="dark"]{--bg:#10191b;--ink:#e9efed;--mute:#9fb0ad;--line:#2f4042;--accent:#5fc4bd;--chip:#1b2b2d;--warn:#f0a35e}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
header{padding:28px 20px 12px;max-width:640px;margin:0 auto}
h1{font:700 34px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.5px}
header p{margin:0;color:var(--mute)}
input,button{font:inherit;color:var(--ink)}
.search{display:block;width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;max-width:640px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 16px;background:var(--chip);font-weight:500;cursor:pointer}
.chip[aria-current="true"]{background:var(--accent);color:var(--bg)}
main{max-width:640px;margin:0 auto;padding:8px 20px 110px}
h2{font:700 24px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:32px 0 4px}
.item{padding:14px 0}
.row{display:flex;align-items:baseline;gap:8px}
.name{font-weight:500}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.price{font-weight:500;white-space:nowrap}
.desc{margin:2px 0 0;color:var(--mute);font-size:15px;max-width:52ch}
.tag{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 8px}
.out .name,.out .price{text-decoration:line-through;color:var(--mute)}
.out .tag{color:var(--warn);border-color:var(--warn)}
.empty{color:var(--mute);padding:32px 0}
.item.hasimg{display:flex;gap:14px;align-items:flex-start}
.item .txt{flex:1;min-width:0}
.item>img{width:92px;height:92px;object-fit:cover;border-radius:12px;flex:none;background:var(--chip)}
.out>img{opacity:.45}
.lang,.atabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lang button,.atabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;cursor:pointer}
.lang button[aria-pressed="true"],.atabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.imgrow{grid-column:1/3;display:flex;gap:8px;align-items:center}
.imgrow img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.imgrow label.btn{display:inline-block;color:var(--ink)}
footer{max-width:640px;margin:0 auto;padding:0 20px 32px;color:var(--mute);font-size:14px}
/* yönetim */
#bar{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:9}
#bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
#msg{flex:1;font-size:14px;color:var(--mute)}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.del{color:var(--warn)}
.adm{padding:8px 0}
.adm input:not([type=checkbox]){width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent}
.adm label{display:block;font-size:14px;color:var(--mute)}
.arow{display:flex;gap:8px;margin-top:28px}
.arow input{font:700 20px "Bricolage Grotesque",system-ui,sans-serif}
.aitem{display:grid;grid-template-columns:1fr 96px;gap:6px;padding:12px 0;border-bottom:1px dotted var(--line)}
.aitem .wide{grid-column:1/3}
.aitem .ctl{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}
.ctl label{display:flex;gap:8px;align-items:center;color:var(--ink)}
.addbtn{margin-top:10px}
.al{margin:4px 0 0;font-size:13px;color:var(--mute)}
.alg{grid-column:1/3}
.alg summary{cursor:pointer;font-weight:500;padding:6px 0}
.algrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding-bottom:6px}
.algrid label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.logo{display:block;max-height:80px;max-width:70%;object-fit:contain;margin-bottom:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;padding:8px 12px;border-radius:12px}}
.banner{display:none;align-items:center;gap:10px;justify-content:center;padding:10px 16px;background:var(--accent);color:var(--bg);font-weight:500;text-align:center}
.banner a{color:inherit;text-decoration:underline}
.banner button{flex:none;border:0;background:transparent;color:inherit;font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.social{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;margin:0 auto;padding:8px 20px 4px}
.social a{border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;box-shadow:0 0 0 1.5px var(--bg);vertical-align:baseline}
.social a{display:inline-flex;align-items:center;gap:8px}
.social svg{width:18px;height:18px;flex:none;fill:currentColor}
</style>
</head>
<body>
<div id="banner" class="banner" role="status"><span id="bannertext"></span><button id="bannerx" type="button">×</button></div>
<header>
  <div class="lang" role="group" aria-label="Dil / Language"><button data-lang="tr">Türkçe</button><button data-lang="en">English</button><button data-lang="ru">Русский</button><button data-lang="de">Deutsch</button></div>
  <img id="logo" class="logo" alt="" style="display:none">
  <h1 id="title">Restoran Adı</h1>
  <p id="sub"></p>
  <input class="search" id="q" type="search" placeholder="Menüde ara" aria-label="Menüde ara">
</header>
<nav id="nav"><div class="chips" id="chips"></div></nav>
<main id="menu"></main>
<div id="social" class="social"></div>
<footer></footer>

function renderMenu(){
  var term=$("q").value.trim().toLocaleLowerCase(LANG), html="", shown=0;
  D.cats.forEach(function(c,i){
    var items=c.items.filter(function(x){return !term||[x.n,x.n_en,x.n_ru,x.n_de,x.d,x.d_en,x.d_ru,x.d_de].join(" ").toLocaleLowerCase(LANG).indexOf(term)>-1});
    if(!items.length) return; shown++;
    html+='<section id="c'+i+'"><h2'+(okColor(c.color)?' style="border-left:6px solid '+c.color+';padding-left:10px"':'')+'>'+esc(L(c,"cat"))+'</h2>'+items.map(function(x){
      var t=L(x,"t"), tag=x.out?'<span class="tag">'+STR[LANG].out+'</span>':(t?'<span class="tag">'+esc(t)+'</span>':"");
      var img=okImg(x.img)?'<img src="'+x.img+'" alt="'+esc(L(x,"n"))+'" loading="lazy">':"", d=L(x,"d"), alh=allergenHtml(x);
      return '<div class="item'+(x.out?' out':'')+(img?' hasimg':'')+'"><div class="txt"><div class="row"><span class="name">'+esc(L(x,"n"))+'</span><span class="dots"></span><span class="price">'+TL(x.p)+'</span></div>'+(d?'<p class="desc">'+esc(d)+'</p>':"")+alh+tag+'</div>'+img+'</div>';
    }).join("")+'</section>';
  });
  $("menu").innerHTML=shown?html:'<p class="empty">'+STR[LANG].none+'</p>';
  $("chips").innerHTML=D.cats.map(function(c,i){return '<button class="chip" data-i="'+i+'">'+(okColor(c.color)?'<span class="dot" style="background:'+c.color+'"></span>':'')+esc(L(c,"cat"))+'</button>'}).join("");
}

function safeUrl(u){ u=String(u==null?"":u).trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:""; }
function socUrl(k,v){
  v=String(v==null?"":v).trim(); if(!v) return "";

  var h=v.replace(/^@/,"").replace(/\s+/g,"");

  if(k==="instagram") return safeUrl("https://instagram.com/"+h);
  if(k==="facebook") return safeUrl("https://facebook.com/"+h);
  if(k==="x") return safeUrl("https://x.com/"+h);
  if(k==="tiktok") return safeUrl("https://www.tiktok.com/@"+h);
  if(k==="youtube") return safeUrl("https://youtube.com/@"+h);

}
